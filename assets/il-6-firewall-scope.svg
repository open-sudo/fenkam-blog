<path d="M250 572 H330 V500" fill="none" stroke="#a33d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 490 L340 510 M340 490 L320 510" stroke="#a33d32" stroke-width="5" stroke-linecap="round"/>
<text x="72" y="670" class="small">Only the named client</text>
<rect x="632" y="214" width="520" height="480" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="656" y="258" class="kicker">CONFIGURED</text>
<rect x="660" y="330" width="174" height="80" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
