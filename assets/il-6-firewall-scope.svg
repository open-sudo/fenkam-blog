<path d="M834 572 H914 V500 H966" fill="none" stroke="#a33d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#red)"/>
<text x="656" y="670" class="small">Port open to the zone</text>
