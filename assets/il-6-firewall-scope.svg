<text x="94" y="361" class="body">Named</text><text x="94" y="391" class="body">client</text>
<rect x="76" y="532" width="174" height="80" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="94" y="563" class="body">Other</text><text x="94" y="593" class="body">clients</text>
<rect x="384" y="410" width="156" height="118" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="400" y="455" class="body">Upload</text><text x="400" y="489" class="body">service</text>
