<rect x="48" y="716" width="544" height="292" rx="14" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="68" y="751" font-size="23" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">After explicit repair</text>
<g data-node="Membership: joined" data-bounds="72,796,496,80">
<rect x="72" y="796" width="496" height="80" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="843.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Membership: joined</text>
</g>
