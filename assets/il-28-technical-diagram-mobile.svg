<rect x="72" y="906" width="496" height="80" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="953.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Local shard: healthy</text>
