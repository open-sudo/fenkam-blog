<path d="M320 510 L320 715" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="337.5" y="572" width="255" height="39" rx="4" fill="#f7fafc"/>
<text x="465" y="601" font-size="25" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">mc admin heal</text>
