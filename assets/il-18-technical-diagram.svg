<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-18: SSH access failed during the memory test</title><desc id="desc">RHEL test sequence: API responding, swap disabled and memory load started, Bash unable to fork, then SSH connections failing.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}</style>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="40" y="50" font-size="18">IL-18 / RHEL 7.9 / RECORDED SEQUENCE</text>
<text x="40" y="100" font-size="40">SSH failed during the memory test</text>
<g data-bounds="60,190,520,180"><rect x="60" y="190" width="520" height="180" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="84" y="234" font-size="26">1. API responding</text>
<text x="84" y="280" font-size="23">Service active; requests answered.</text>
<text x="84" y="316" font-size="23">OOMScoreAdjust=-1000 confirmed.</text>
</g>
<g data-bounds="620,190,520,180"><rect x="620" y="190" width="520" height="180" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="644" y="234" font-size="26">2. Agent starts memory load</text>
<text x="644" y="280" font-size="23">Swap disabled; Python hog running.</text>
<text x="644" y="316" font-size="23">Hog then logs 1000 MiB allocated.</text>
</g>
<g data-bounds="60,460,520,180"><rect x="60" y="460" width="520" height="180" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="84" y="504" font-size="26">3. Shell command fails</text>
<text x="84" y="550" font-size="23">bash: fork:</text>
<text x="84" y="586" font-size="23">Cannot allocate memory</text>
</g>
<g data-bounds="620,460,520,180"><rect x="620" y="460" width="520" height="180" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="644" y="504" font-size="26">4. SSH connections fail</text>
<text x="644" y="550" font-size="23">Repeated commands cannot run.</text>
<text x="644" y="586" font-size="23">No restored access before run ends.</text>
</g>
<text x="40" y="760" font-size="23">Checks and cleanup stopped when SSH failed.</text>
</svg>
