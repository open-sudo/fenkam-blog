rUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-18  /  DEPLOYMENT DIAGRAM</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The load shared its management cgroup</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Seven stress-test records placed the memory load in the command service’s cgroup.</text>
<rect x="64" y="210" width="700" height="440" rx="14" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="84" y="245" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">Command-execution service cgroup</text>
<g data-node="Management process" data-bounds="96,305,636,125">
<rect x="96" y="305" width="636" height="125" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="414" y="374.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Management process</text>
</g>
<g data-node="Python memory load" data-bounds="96,465,636,125">
<rect x="96" y="465" width="636" height="125" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="414" y="534.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Python memory load</text>
</g>
<g data-node="Observed access loss" data-bounds="820,335,316,190">
<rect x="820" y="335" width="316" height="190" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="978" y="383.04" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Observed access</text>
<text x="978" y="415.8" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">loss</text>
<text x="978" y="460.56" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Cause not fully</text>
<text x="978" y="490.56" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">established</text>
</g>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">One OOM log named a Python child. It did not establish that the management daemon was killed.</text>
</svg>
