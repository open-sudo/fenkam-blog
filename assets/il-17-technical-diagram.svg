<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">One POST could create two orders</title><desc id="desc">Hypothetical order submission: node2 saves an order, its reply fails to arrive, and the proxy sends the same POST to node3, which creates another order.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}</style>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="40" y="50" font-size="18">IL-17 / HYPOTHETICAL ORDER EXAMPLE</text>
<text x="40" y="100" font-size="40">One POST could create two orders</text>
<text x="40" y="140" font-size="25">With backends that create an order for each POST</text>
<g data-bounds="60,205,520,170"><rect x="60" y="205" width="520" height="170" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="82" y="253" font-size="26">1. Client submits one order</text>
<text x="82" y="305" font-size="23">Node1 forwards the POST to node2.</text>
</g>
<g data-bounds="620,205,520,170"><rect x="620" y="205" width="520" height="170" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="642" y="253" font-size="26">2. Node2 saves the order</text>
<text x="642" y="305" font-size="23">Its reply fails to reach the proxy.</text>
</g>
<g data-bounds="60,460,520,170"><rect x="60" y="460" width="520" height="170" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="82" y="508" font-size="26">3. Proxy retries the same POST</text>
<text x="82" y="560" font-size="23">The exception handler tries node3.</text>
</g>
<g data-bounds="620,460,520,170"><rect x="620" y="460" width="520" height="170" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="642" y="508" font-size="26">4. Node3 creates another order</text>
<text x="642" y="560" font-size="23">The client submitted only once.</text>
</g>
<text x="40" y="755" font-size="24">The proxy retries after a missing reply.</text>
</svg>
