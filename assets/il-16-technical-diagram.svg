<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-16: Verification access exceeded the check</title>
<desc id="desc">Access-control comparison. The recorded global database grant exceeded the verification operation and remained after testing.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-16  /  ACCESS-CONTROL MATRIX</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Verification access exceeded the check</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">A database test account was left with ALL PRIVILEGES on *.*.</text>
<rect x="64" y="245" width="270" height="100" fill="#e9f0f5" stroke="#b8c7d3"/>
<text x="199" y="290" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Scope</text>
<rect x="334" y="245" width="260" height="100" fill="#e9f0f5" stroke="#b8c7d3"/>
<text x="464" y="290" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Required check</text>
<rect x="594" y="245" width="260" height="100" fill="#e9f0f5" stroke="#b8c7d3"/>
<text x="724" y="290" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Other database</text>
<text x="724" y="322" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">writes</text>
<rect x="854" y="245" width="282" height="100" fill="#e9f0f5" stroke="#b8c7d3"/>
<text x="995" y="290" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">After verification</text>
<rect x="64" y="345" width="270" height="145" fill="#e9f0f5" stroke="#b8c7d3"/>
<text x="199" y="390" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Task need</text>
<rect x="334" y="345" width="260" height="145" fill="#edf5fc" stroke="#b8c7d3"/>
<text x="464" y="390" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">Needed</text>
<rect x="594" y="345" width="260" height="145" fill="#edf5fc" stroke="#b8c7d3"/>
<text x="724" y="390" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">Not justified</text>
<rect x="854" y="345" width="282" height="145" fill="#edf5fc" stroke="#b8c7d3"/>
<text x="995" y="390" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">No ongoing need</text>
<text x="995" y="422" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">stated</text>
<rect x="64" y="490" width="270" height="145" fill="#e9f0f5" stroke="#b8c7d3"/>
<text x="199" y="535" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Delivered account</text>
<rect x="334" y="490" width="260" height="145" fill="#fff7e8" stroke="#b8c7d3"/>
<text x="464" y="535" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">Allowed</text>
<rect x="594" y="490" width="260" height="145" fill="#fff7e8" stroke="#b8c7d3"/>
<text x="724" y="535" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">Also allowed</text>
<rect x="854" y="490" width="282" height="145" fill="#fff7e8" stroke="#b8c7d3"/>
<text x="995" y="535" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle">Account retained</text>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">The successful check demonstrated access, not a reason to retain every permission.</text>
</svg>
