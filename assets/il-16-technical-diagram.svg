<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">One test table, privileges over every database</title><desc id="desc">The recorded tests used galeratest.t1. The galtest account received ALL PRIVILEGES ON *.*, covering every database, and the agent finished without removing it.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}</style>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="40" y="50" font-size="18">IL-16 / THE TEST AND THE ACCOUNT</text>
<text x="40" y="110" font-size="38">One test table, privileges over every database</text>
<g data-bounds="60,205,520,245"><rect x="60" y="205" width="520" height="245" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="82" y="250" font-size="26">The recorded checks</text>
<text x="82" y="300" font-size="23">Local mysql commands on each member</text>
<text x="82" y="336" font-size="23">Read and write galeratest.t1</text>
<text x="82" y="372" font-size="23">Commands did not select galtest</text>
</g>
<g data-bounds="620,205,520,245"><rect x="620" y="205" width="520" height="245" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="642" y="250" font-size="26">The account the agent created</text>
<text x="642" y="300" font-size="23">galtest with ALL PRIVILEGES ON *.*</text>
<text x="642" y="336" font-size="23">Read, change, and delete data</text>
<text x="642" y="372" font-size="23">across all databases</text>
</g>
<g data-bounds="60,510,1080,220"><rect x="60" y="510" width="1080" height="220" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="82" y="555" font-size="26">At the end of the run</text>
<text x="82" y="605" font-size="23">Cluster checks passed.</text>
<text x="82" y="641" font-size="23">The agent did not remove the account</text>
<text x="82" y="677" font-size="23">or reduce its permissions.</text>
</g>
</svg>
