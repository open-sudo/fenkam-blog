<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1170" viewBox="0 0 640 1170" role="img" aria-labelledby="title desc">
<title id="title">IL-21: The test path changed the result</title>
<desc id="desc">The scoring tool rejected the short password, but administrative password-setting commands accepted it for a test account.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1170" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-21  /  DEPLOYMENT COMPARISON</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The test path changed the result</text>
<text x="40" y="135" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">CentOS Stream 10: a 12-character minimum was</text>
<text x="40" y="167" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">requested.</text>
<text x="48" y="230" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Scoring-tool test</text>
<g data-node="Supply an 11-character password" data-bounds="48,258,544,78">
<rect x="48" y="258" width="544" height="78" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="304.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Supply an 11-character password</text>
</g>
<path d="M320 336 L320 357" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Tool rejects it" data-bounds="48,358,544,78">
<rect x="48" y="358" width="544" height="78" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="404.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Tool rejects it</text>
</g>
<path d="M320 436 L320 457" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Policy appears effective" data-bounds="48,458,544,78">
<rect x="48" y="458" width="544" height="78" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="504.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Policy appears effective</text>
</g>
<text x="48" y="620" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Administrative update</text>
<g data-node="Use chpasswd / passwd --stdin" data-bounds="48,648,544,78">
<rect x="48" y="648" width="544" height="78" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="694.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Use chpasswd / passwd --stdin</text>
</g>
<path d="M320 726 L320 747" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="11-character password accepted" data-bounds="48,748,544,78">
<rect x="48" y="748" width="544" height="78" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="794.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">11-character password accepted</text>
</g>
<path d="M320 826 L320 847" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Actual setting path differs" data-bounds="48,848,544,78">
<rect x="48" y="848" width="544" height="78" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="894.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Actual setting path differs</text>
</g>
<text x="40" y="1068.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The administrative setters accepted a</text><text x="40" y="1100.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">password that pwscore rejected.</text></svg>