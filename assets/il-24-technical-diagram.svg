<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-24: The repair loop repeated the damaging edit</title>
<desc id="desc">Control-flow loop reconstructed from the Apache setup. Restoring the file did not change the command that had broken it.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-24  /  FLOWCHART</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The repair loop repeated the damaging edit</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">RHEL 9 Apache configuration during HTTPS setup.</text>
<g data-node="Start with clean configuration" data-bounds="64,225,450,150">
<rect x="64" y="225" width="450" height="150" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="289" y="307.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Start with clean configuration</text>
</g>
<g data-node="sed inserts text before every line" data-bounds="686,225,450,150">
<rect x="686" y="225" width="450" height="150" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="911" y="291.04" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">sed inserts text before every</text>
<text x="911" y="323.8" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">line</text>
</g>
<g data-node="Apache configuration is broken" data-bounds="686,490,450,150">
<rect x="686" y="490" width="450" height="150" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="911" y="572.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Apache configuration is broken</text>
</g>
<g data-node="Restore clean configuration" data-bounds="64,490,450,150">
<rect x="64" y="490" width="450" height="150" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="289" y="572.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Restore clean configuration</text>
</g>
<path d="M515 300 L685 300" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<path d="M911 376 L911 489" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<path d="M685 565 L515 565" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M289 489 L289 428 L620 428 L620 300 L685 300" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<rect x="390" y="380" width="420" height="35.28" rx="4" fill="#f7fafc"/>
<text x="600" y="406" font-size="22" fill="#a3342c" style="fill:#a3342c" text-anchor="middle" class="edge">Repeat same edit</text>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">The same damaging edit was retried before the agent finally corrected the pattern.</text>
</svg>
