<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1460" viewBox="0 0 640 1460" role="img" aria-labelledby="title desc">
<title id="title">IL-42: Certificate renewal changed file permissions</title>
<desc id="desc">On one RHEL 9.8 VM, the root renewal job replaced active.pem with a mode 0600 file. The autohttps service could not read it: 78 of 80 requests failed. Changing the script to write mode 0640 allowed all 100 requests in the next test to succeed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker></defs>
<rect width="640" height="1460" fill="#f7fafc"/>
<text x="40" y="47" font-size="19" fill="#546574" text-anchor="start" font-weight="700">IL-42  /  DATA FLOW + FILE STATE</text>
<text x="40" y="105" font-size="36" fill="#17212b" text-anchor="start" font-weight="700">A renewed file broke</text>
<text x="40" y="149" font-size="36" fill="#17212b" text-anchor="start" font-weight="700">new TLS connections</text>
<text x="40" y="205" font-size="27" fill="#546574" text-anchor="start">One VM: node1 · RHEL 9.8</text>
<text x="40" y="242" font-size="27" fill="#546574" text-anchor="start">10.100.23.10 · HTTPS on TCP 8443</text>
<rect x="32" y="278" width="576" height="748" rx="12" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="320" font-size="27" fill="#546574" text-anchor="start" font-weight="700">First forced certificate rotation</text>
<g data-node="Renewal job" data-bounds="72,350,496,146">
<rect x="72" y="350" width="496" height="146" rx="12" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320.0" y="396.6" font-size="30" fill="#175c88" text-anchor="middle" font-weight="700">Renewal job</text>
<text x="320.0" y="432.6" font-size="28" fill="#17212b" text-anchor="middle">Runs as root</text>
<text x="320.0" y="468.6" font-size="28" fill="#17212b" text-anchor="middle">Creates a new bundle</text>
</g>
<path d="M320 496 L320 566" fill="none" stroke="#175c88" stroke-width="3" marker-end="url(#blue)"/>
<text x="350" y="536" font-size="25" fill="#546574" text-anchor="start">replaces file</text>
<g data-node="active.pem" data-bounds="72,566,496,160">
<rect x="72" y="566" width="496" height="160" rx="12" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320.0" y="620.24" font-size="32" fill="#a3342c" text-anchor="middle" font-weight="700">active.pem</text>
<text x="320.0" y="656.24" font-size="30" fill="#17212b" text-anchor="middle">root:autohttps</text>
<text x="320.0" y="692.24" font-size="30" fill="#17212b" text-anchor="middle">0600 · root-only</text>
</g>
<path d="M320 726 L320 818" fill="none" stroke="#a3342c" stroke-width="3" marker-end="url(#red)"/>
<circle cx="320.0" cy="772.0" r="14" fill="#fff1ee"/>
<path d="M312.0 764.0 L328.0 780.0 M312.0 780.0 L328.0 764.0" stroke="#a3342c" stroke-width="3"/>
<text x="350" y="781" font-size="27" fill="#a3342c" text-anchor="start" font-weight="700">read fails</text>
<g data-node="HTTPS process" data-bounds="72,818,496,164">
<rect x="72" y="818" width="496" height="164" rx="12" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320.0" y="855.28" font-size="29" fill="#175c88" text-anchor="middle" font-weight="700">HTTPS process</text>
<text x="320.0" y="891.28" font-size="27" fill="#17212b" text-anchor="middle">Runs as autohttps</text>
<text x="320.0" y="927.28" font-size="27" fill="#17212b" text-anchor="middle">Loads file per connection</text>
<text x="320.0" y="963.28" font-size="27" fill="#17212b" text-anchor="middle">New TLS handshakes fail</text>
</g>
<text x="48" y="1080" font-size="28" fill="#a3342c" text-anchor="start" font-weight="700">First rotation: 78 of 80 requests failed.</text>
<g data-node="Fix the renewal script" data-bounds="48,1130,544,206">
<rect x="48" y="1130" width="544" height="206" rx="12" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320.0" y="1188.6" font-size="30" fill="#176b50" text-anchor="middle" font-weight="700">Fix the renewal script</text>
<text x="320.0" y="1224.6" font-size="28" fill="#17212b" text-anchor="middle">Write replacements as 0640</text>
<text x="320.0" y="1260.6" font-size="28" fill="#17212b" text-anchor="middle">Keep owner root:autohttps</text>
<text x="320.0" y="1296.6" font-size="28" fill="#17212b" text-anchor="middle">Then 100 of 100 requests succeed</text>
</g>
<text x="40" y="1390" font-size="25" fill="#546574" text-anchor="start">Recorded lab tests; the defect was fixed</text>
<text x="40" y="1424" font-size="25" fill="#546574" text-anchor="start">before the final rotation and reboot checks.</text>
</svg>
