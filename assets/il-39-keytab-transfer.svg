<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-39: the keytab transfer</title><desc id="desc">The login server serves a secret keytab over temporary HTTPS port 9443. The application server downloaded it without client authentication. Another reachable client knowing the URL could download it too; no theft was observed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.kicker{font-size:22px;font-weight:700;letter-spacing:2px;fill:#536170}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:26px;fill:#536170}.node{font-size:32px;font-weight:700}.node-small{font-size:30px;font-weight:700}.body{font-size:26px}.small{font-size:24px;fill:#536170}.blue{fill:#185b8c}.green{fill:#176b50}.red{fill:#a33d32}.center{text-anchor:middle}</style>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#185b8c"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#176b50"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#a33d32"/></marker></defs>
<rect width="1200" height="800" fill="#f7f9fb"/>
<text x="64" y="54" class="kicker">IL-39 · SECRET TRANSFER</text>
<text x="64" y="112" class="title">A secret file, two servers</text>
<text x="64" y="158" class="sub">The application needs a keytab to validate Kerberos login tickets.</text>
<rect x="64" y="235" width="320" height="220" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="88" y="282" class="node">Login server</text>
<text x="88" y="328" class="body">Issues login tickets</text>
<text x="88" y="370" class="small">HTTPS on port 9443</text>
<rect x="88" y="394" width="272" height="42" rx="14" fill="#eaf1f8" stroke="#c9d2db" stroke-width="2"/>
<text x="104" y="423" class="small">keytab · secret keys</text>
<rect x="800" y="235" width="336" height="220" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="824" y="282" class="node">Application server</text>
<text x="824" y="328" class="body">Needs the keytab</text>
<text x="824" y="387" class="body green">Download succeeded</text>
<path d="M384 342 H798" fill="none" stroke="#176b50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="592" y="301" class="body center">Keytab over HTTPS</text>
<text x="592" y="387" class="small red center">No client login</text>
<rect x="800" y="535" width="336" height="140" rx="14" fill="#fff3ef" stroke="#dbada5" stroke-width="2"/>
<text x="824" y="582" class="node">Another client</text>
<text x="824" y="626" class="body">Can reach the URL</text>
<path d="M224 455 V605 H798" fill="none" stroke="#a33d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#red)"/>
<text x="510" y="563" class="body red center">Could download a copy</text>
<text x="64" y="724" class="body">The port was not restricted to the application server.</text>
<text x="64" y="770" class="small">Dashed route: possible access, not an observed theft.</text>
</svg>
