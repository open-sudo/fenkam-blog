<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-34: Source cleanup did not verify installed code</title>
<desc id="desc">Software-supply data flow. Removing the temporary gpgcheck=0 source definition did not retroactively authenticate the packages already installed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-34  /  DATA-FLOW DIAGRAM</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Source cleanup did not verify installed code</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">RHEL 7.9 internal DNS used a temporary CentOS Vault repository.</text>
<g data-node="Temporary source definition" data-bounds="64,300,292,210">
<path d="M64 317 C64 295,356 295,356 317 V493 C356 515,64 515,64 493 Z M64 317 C64 339,356 339,356 317" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="210" y="374.68" font-size="26" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Temporary source</text>
<text x="210" y="405.1" font-size="26" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">definition</text>
<text x="210" y="447.52" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">CentOS Vault ·</text>
<text x="210" y="477.52" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">gpgcheck=0</text>
</g>
<g data-node="Yum installation" data-bounds="454,300,292,210">
<rect x="454" y="300" width="292" height="210" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="600" y="373.89" font-size="26" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Yum installation</text>
<text x="600" y="416.31" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">dnsmasq + verification</text>
<text x="600" y="446.31" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">tools</text>
</g>
<path d="M357 405 L453 405" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Installed packages" data-bounds="844,300,292,210">
<path d="M844 317 C844 295,1136 295,1136 317 V493 C1136 515,844 515,844 493 Z M844 317 C844 339,1136 339,1136 317" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="990" y="389.89" font-size="26" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Installed packages</text>
<text x="990" y="432.31" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Remain after source</text>
<text x="990" y="462.31" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">removal</text>
</g>
<path d="M747 405 L843 405" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="75" y="586" width="1050" height="39" rx="4" fill="#f7fafc"/>
<text x="600" y="615" font-size="25" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">Deleting a repository file does not authenticate installed packages</text>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">dnsmasq worked after reboot. Neither an intercepted download nor a malicious package was observed.</text>
</svg>
