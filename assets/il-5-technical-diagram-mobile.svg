<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-5: The secret crossed a storage boundary</title>
<desc id="desc">Printing the password file created another copy in the saved command log. Deleting the file left that logged copy intact.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-5  /  DATA-FLOW DIAGRAM</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Printing a password made</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">another copy</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Permissions on a server file did not govern the</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">tool&#8217;s saved command output.</text>
<g data-node="Password file" data-bounds="48,248,544,160">
<path d="M48 265 C48 243,592 243,592 265 V391 C592 413,48 413,48 391 Z M48 265 C48 287,592 287,592 265" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="327.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Password file</text>
<text x="320" y="374.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Server copy</text>
</g>
<path d="M320 410 L320 497" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="339.5" y="418" width="245" height="39" rx="4" fill="#f7fafc"/>
<text x="462" y="447" font-size="25" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Read password</text>
<g data-node="cat / display" data-bounds="48,498,544,160">
<ellipse cx="320.0" cy="578.0" rx="272.0" ry="80.0" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="561.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">cat / display</text>
<text x="320" y="608.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Command execution</text>
</g>
<path d="M320 660 L320 747" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="339.5" y="668" width="245" height="39" rx="4" fill="#f7fafc"/>
<text x="462" y="697" font-size="25" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Capture stdout</text>
<g data-node="Saved command log" data-bounds="48,748,544,160">
<path d="M48 765 C48 743,592 743,592 765 V891 C592 913,48 913,48 891 Z M48 765 C48 787,592 787,592 765" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="827.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Saved command log</text>
<text x="320" y="874.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Separate retained copy</text>
</g>
<text x="40" y="1058.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Deleting the password file left its value</text><text x="40" y="1090.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">in the command log.</text></svg>