<text x="40" y="1458.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The three runs left different core</text><text x="40" y="1490.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">packages and repair histories.</text></svg>