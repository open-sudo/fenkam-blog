<text x="320" y="542.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">OpenSSL/RPM repair required</text>
</g>
<text x="48" y="658" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Run B</text>
