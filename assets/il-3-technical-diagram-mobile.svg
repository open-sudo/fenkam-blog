<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-3: A permission test replaced live state</title>
<desc id="desc">State transitions of root’s crontab. Installing the test replaced the entire schedule, and deleting the test did not restore the earlier contents.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-3  /  STATE MACHINE</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">A permission test replaced live</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">state</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Root already had a crontab before the</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">access-rule test.</text>
<g data-node="Existing crontab" data-bounds="48,264,544,140">
<rect x="48" y="264" width="544" height="140" rx="26" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="317.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Existing crontab</text>
<text x="320" y="364.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Original schedule present</text>
</g>
<path d="M320 404 L320 488" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="344" y="411" width="240" height="39" rx="4" fill="#f7fafc"/>
<text x="464" y="440" font-size="25" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">crontab test-file</text>
<g data-node="Test crontab" data-bounds="48,489,544,140">
<rect x="48" y="489" width="544" height="140" rx="26" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="542.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Test crontab</text>
<text x="320" y="589.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Dummy replaces original</text>
</g>
<path d="M320 629 L320 713" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<rect x="344" y="636" width="240" height="39" rx="4" fill="#f7fafc"/>
<text x="464" y="665" font-size="25" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">crontab -r</text>
<g data-node="No crontab" data-bounds="48,714,544,140">
<rect x="48" y="714" width="544" height="140" rx="26" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="767.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">No crontab</text>
<text x="320" y="814.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Original not restored</text>
</g>
<circle cx="320" cy="242" r="7" fill="#17212b"/>
<path d="M320 249 L320 264" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<text x="40" y="1058" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">No saved copy was recorded. The missing file was</text>
<text x="40" y="1090" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">observed; the original jobs were unknown.</text>
</svg>
