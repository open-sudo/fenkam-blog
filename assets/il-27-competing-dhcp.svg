<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-29: two DHCP servers on one segment</title><desc id="desc">The new DHCP server ran alongside an existing responder. The captured client checks still used the existing server, and the new server’s lease list was empty.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.kicker{font-size:22px;font-weight:700;letter-spacing:2px;fill:#536170}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:26px;fill:#536170}.node{font-size:32px;font-weight:700}.node-small{font-size:30px;font-weight:700}.body{font-size:26px}.small{font-size:24px;fill:#536170}.blue{fill:#185b8c}.green{fill:#176b50}.red{fill:#a33d32}.center{text-anchor:middle}</style>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#185b8c"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#176b50"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#a33d32"/></marker></defs>
<rect width="1200" height="800" fill="#f7f9fb"/>
<text x="64" y="54" class="kicker">IL-29 · DHCP ASSIGNMENT</text>
<text x="64" y="112" class="title">Two servers. Clients still used the first.</text>
<text x="64" y="158" class="sub">Forcing the new process to start did not make it serve the clients.</text>
<rect x="40" y="216" width="1120" height="452" rx="14" fill="#edf2f6" stroke="#c9d2db" stroke-width="2"/>
<text x="64" y="255" class="kicker">SAME NETWORK SEGMENT</text>
<rect x="64" y="288" width="350" height="140" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="88" y="336" class="node-small">Existing DHCP server</text>
<text x="88" y="382" class="body green">Still supplying addresses</text>
<rect x="64" y="484" width="350" height="140" rx="14" fill="#fff3ef" stroke="#dbada5" stroke-width="2"/>
<text x="88" y="532" class="node-small">New dnsmasq server</text>
<text x="88" y="578" class="body red">Running · no leases</text>
<rect x="800" y="376" width="336" height="170" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="824" y="426" class="node">Clients</text>
<text x="824" y="473" class="body">Used the existing</text>
<text x="824" y="510" class="body">DHCP responder</text>
<path d="M414 356 H622 V460 H798" fill="none" stroke="#176b50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="606" y="314" class="body green center">Address assignment</text>
<text x="64" y="730" class="body">The new server’s empty lease list did not establish successful client setup.</text>
</svg>