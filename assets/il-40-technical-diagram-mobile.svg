<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-40: Process-name cleanup crossed service boundaries</title>
<desc id="desc">Dependency and blast-radius diagram for the firewall cleanup example. Killing every process named socat selected both a temporary listener and the management transport.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-40  /  DEPENDENCY GRAPH</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Process-name cleanup crossed</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">service boundaries</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Selected firewall-test example: both workloads</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">used socat.</text>
<g data-node="pkill socat" data-bounds="48,248,544,115">
<rect x="48" y="248" width="544" height="115" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="288.95" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">pkill socat</text>
<text x="320" y="336.05" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Select by executable name</text>
</g>
<g data-node="Test listener" data-bounds="48,513,256,190">
<rect x="48" y="513" width="256" height="190" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="176" y="574.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Test listener</text>
<text x="176" y="619.18" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Temporary</text>
<text x="176" y="652.18" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">workload</text>
</g>
<path d="M320 364 L320 448 L176 448 L176 512" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<g data-node="Management transport" data-bounds="336,513,256,190">
<rect x="336" y="513" width="256" height="190" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="464" y="574.54" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Management</text>
<text x="464" y="607.3" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">transport</text>
<text x="464" y="652.06" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Also uses socat</text>
</g>
<path d="M320 364 L320 448 L464 448 L464 512" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<g data-node="Management connection lost" data-bounds="48,863,544,130">
<rect x="48" y="863" width="544" height="130" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="911.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Management connection lost</text>
<text x="320" y="958.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Recovery through another machine</text>
</g>
<path d="M464 704 L464 793 L320 793 L320 862" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<text x="40" y="1058" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The management connection was interrupted. SSH</text>
<text x="40" y="1090" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">from another machine was used to restore</text>
<text x="40" y="1122" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">service.</text>
</svg>
