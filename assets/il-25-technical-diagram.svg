<text x="892" y="350.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">/var/lib/inventory</text>
<text x="892" y="395.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Promised write scope</text>
</g>
<g data-node="/dev/shm" data-bounds="680,490,424,120">
<path d="M680 503 H836.88 L862.3199999999999 520 H1104 V610 H680 Z" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="892" y="550.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">/dev/shm</text>
<text x="892" y="595.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Probe write succeeds</text>
</g>
<path d="M457 450 L570 450 L570 550 L679 550" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<rect x="450" y="378" width="260" height="35.28" rx="4" fill="#f7fafc"/>
<text x="580" y="404" font-size="22" fill="#a3342c" style="fill:#a3342c" text-anchor="middle" class="edge">Observed write</text>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">The probe wrote to /dev/shm. It was not evidence of an attacker or of every possible write path.</text>
