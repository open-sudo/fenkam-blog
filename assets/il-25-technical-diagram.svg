rUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-25  /  ACCESS-CONTROL DIAGRAM</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The allowed-write claim had another path</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">A separate probe used restrictions equivalent to the delivered service settings.</text>
<rect x="64" y="210" width="1072" height="440" rx="14" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="84" y="245" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">Delivered policy · separate equivalent-restriction probe</text>
<g data-node="Probe process" data-bounds="96,365,360,170">
<ellipse cx="276.0" cy="450.0" rx="180.0" ry="85.0" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="276" y="434.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Probe process</text>
<text x="276" y="479.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Equivalent restrictions</text>
</g>
