<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-23: The playbook started after manual setup</title>
<desc id="desc">An AIDE database existed before the playbook ran. Ansible therefore skipped the initialization task needed on a fresh host.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-23  /  ACTIVITY DIAGRAM</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The playbook started after manual setup</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">AIDE’s reference database already existed before the Ansible test.</text>
<g data-node="Package installed directly; database already present" data-bounds="390,210,420,90">
<rect x="390" y="210" width="420" height="90" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="600" y="246.68" font-size="26" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Package installed directly</text>
<text x="600" y="277.1" font-size="26" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Database already present</text>
</g>
<g data-node="Reference database exists?" data-bounds="420,320,360,120">
<path d="M600.0 320 L780 380.0 L600.0 440 L420 380.0 Z" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="600" y="372" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Reference database</text>
<text x="600" y="401.25" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">exists?</text>
</g>
<path d="M600 301 L600 319" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Yes: skip initialization" data-bounds="64,485,490,120">
<rect x="64" y="485" width="490" height="120" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="309" y="552.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Yes: skip initialization</text>
</g>
<g data-node="No: first-install branch untested" data-bounds="646,485,490,120">
<rect x="646" y="485" width="490" height="120" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="891" y="552.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">No: first-install branch untested</text>
</g>
<g data-node="Ansible reports no changes" data-bounds="390,640,420,80">
<rect x="390" y="640" width="420" height="80" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="600" y="686.36" font-size="24" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Ansible reports no changes</text>
</g>
<path d="M420 380 L309 380 L309 484" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M780 380 L891 380 L891 484" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#amber)"/>
<path d="M309 606 L309 672 L389 672" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<rect x="139" y="429" width="340" height="35.28" rx="4" fill="#f7fafc"/>
<text x="309" y="455" font-size="22" fill="#176b50" style="fill:#176b50" text-anchor="middle" class="edge">Yes · recorded</text>
<rect x="721" y="429" width="340" height="35.28" rx="4" fill="#f7fafc"/>
<text x="891" y="455" font-size="22" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">No · not exercised</text>
<text x="64" y="737.0" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">Ansible skipped the initialization needed on a host without a database.</text></svg>