<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1320" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
<title id="title">IL-23: The playbook started after manual setup</title>
<desc id="desc">An AIDE database existed before the playbook ran. Ansible therefore skipped the initialization task needed on a fresh host.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1320" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-23  /  ACTIVITY DIAGRAM</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The playbook started after manual</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">setup</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">AIDE’s reference database already existed</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">before the Ansible test.</text>
<g data-node="Package installed directly; database already present" data-bounds="48,248,544,90">
<rect x="48" y="248" width="544" height="90" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="300.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Database already present</text>
</g>
<g data-node="Reference database exists?" data-bounds="100,403,440,150">
<path d="M320.0 403 L540 478.0 L320.0 553 L100 478.0 Z" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="469.04" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Reference database</text>
<text x="320" y="501.8" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">exists?</text>
</g>
<path d="M320 339 L320 402" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Yes: skip initialization" data-bounds="64,633,512,130">
<rect x="64" y="633" width="512" height="130" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="705.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Yes: skip initialization</text>
</g>
<g data-node="No: first-install branch untested" data-bounds="64,858,512,130">
<rect x="64" y="858" width="512" height="130" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="930.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">No: first-install branch untested</text>
</g>
<g data-node="Ansible reports no changes" data-bounds="48,1083,544,100">
<rect x="48" y="1083" width="544" height="100" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="1140.69" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Ansible reports no changes</text>
</g>
<path d="M320 554 L320 632" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M540 478 L611 478 L611 923 L578 923" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#amber)"/>
<path d="M64 698 L30 698 L30 1133 L47 1133" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="40" y="1218.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Ansible skipped the initialization needed</text><text x="40" y="1250.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">on a host without a database.</text></svg>