<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-15: Test files entered the recovery namespace</title>
<desc id="desc">Filesystem tree of the retention-test problem. Synthetic archives were left in the same namespace as genuine backups.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-15  /  FILESYSTEM TREE</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Test files entered the recovery</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">namespace</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Retention testing created archives that looked</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">like operational backups.</text>
<g data-node="Backup directory at handover" data-bounds="48,248,544,130">
<path d="M48 261 H249.28 L281.91999999999996 278 H592 V378 H48 Z" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="336.95" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Backup directory at handover</text>
</g>
<g data-node="Genuine archive" data-bounds="112,478,480,140">
<path d="M112 495 C112 473,592 473,592 495 V601 C592 623,112 623,112 601 Z M112 495 C112 517,592 517,592 495" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="352" y="547.185" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Genuine archive</text>
<text x="352" y="593.115" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Real recovery data</text>
</g>
<path d="M76 381 L76 548 L110 548" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<g data-node="Backdated test copy" data-bounds="112,653,480,140">
<path d="M112 670 C112 648,592 648,592 670 V776 C592 798,112 798,112 776 Z M112 670 C112 692,592 692,592 670" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="352" y="722.185" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Backdated test copy</text>
<text x="352" y="768.115" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Copied from a later archive</text>
</g>
<path d="M76 381 L76 723 L110 723" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<g data-node="More backdated copies" data-bounds="112,828,480,140">
<path d="M112 845 C112 823,592 823,592 845 V951 C592 973,112 973,112 951 Z M112 845 C112 867,592 867,592 845" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="352" y="897.185" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">More backdated copies</text>
<text x="352" y="943.115" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Still present after the test</text>
</g>
<path d="M76 381 L76 898 L110 898" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="40" y="1058" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">A date-shaped filename did not prove the</text>
<text x="40" y="1090" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">contents came from that date.</text>
</svg>
