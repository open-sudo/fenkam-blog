<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1170" viewBox="0 0 640 1170" role="img" aria-labelledby="title desc">
<title id="title">IL-2: The module followed the kernel version</title>
<desc id="desc">Kernel and module dependencies in two separate runs. The package names led to different booted kernels; both delivered working swap.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1170" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-2  /  DEPENDENCY GRAPH</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The module followed the kernel</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">version</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Ubuntu 16.04: zram needed modules matching the</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">kernel that actually booted.</text>
<text x="48" y="268" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Downgrade run</text>
<g data-node="linux-image-extra search" data-bounds="48,296,544,78">
<rect x="48" y="296" width="544" height="78" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="342.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">linux-image-extra search</text>
</g>
<path d="M320 374 L320 395" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Modules for 4.4.0-142" data-bounds="48,396,544,78">
<rect x="48" y="396" width="544" height="78" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="442.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Modules for 4.4.0-142</text>
</g>
<path d="M320 474 L320 495" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue-start)"/>
<g data-node="Boot kernel 4.4.0-142" data-bounds="48,496,544,78">
<rect x="48" y="496" width="544" height="78" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="542.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Boot kernel 4.4.0-142</text>
</g>
<text x="48" y="658" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Separate matching-module run</text>
<g data-node="linux-modules-extra search" data-bounds="48,686,544,78">
<rect x="48" y="686" width="544" height="78" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="732.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">linux-modules-extra search</text>
</g>
<path d="M320 764 L320 785" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Modules for 4.4.0-210" data-bounds="48,786,544,78">
<rect x="48" y="786" width="544" height="78" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="832.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Modules for 4.4.0-210</text>
</g>
<path d="M320 864 L320 885" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue-start)"/>
<g data-node="Keep kernel 4.4.0-210" data-bounds="48,886,544,78">
<rect x="48" y="886" width="544" height="78" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="932.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Keep kernel 4.4.0-210</text>
</g>
<text x="40" y="1068" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Each module must match its kernel. The second run</text>
<text x="40" y="1100" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">showed the downgrade was avoidable.</text>
</svg>
