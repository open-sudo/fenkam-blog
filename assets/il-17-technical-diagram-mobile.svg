<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1200" viewBox="0 0 640 1200" role="img" aria-labelledby="title desc">
<title id="title">One POST could create two orders</title><desc id="desc">Hypothetical order submission: node2 saves an order, its reply fails to arrive, and the proxy sends the same POST to node3, which creates another order.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}</style>
<rect width="640" height="1200" fill="#f7fafc"/>
<text x="40" y="50" font-size="18">IL-17 / HYPOTHETICAL ORDER EXAMPLE</text>
<text x="40" y="100" font-size="29">One POST could create two orders</text>
<text x="40" y="140" font-size="21">With backends that create an order for each POST</text>
<g data-bounds="40,190,560,170"><rect x="40" y="190" width="560" height="170" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="62" y="238" font-size="26">1. Client submits one order</text>
<text x="62" y="290" font-size="23">Node1 forwards the POST to node2.</text>
</g>
<g data-bounds="40,410,560,170"><rect x="40" y="410" width="560" height="170" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="62" y="458" font-size="26">2. Node2 saves the order</text>
<text x="62" y="510" font-size="23">Its reply fails to reach the proxy.</text>
</g>
<g data-bounds="40,630,560,170"><rect x="40" y="630" width="560" height="170" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="62" y="678" font-size="26">3. Proxy retries the same POST</text>
<text x="62" y="730" font-size="23">The exception handler tries node3.</text>
</g>
<g data-bounds="40,850,560,170"><rect x="40" y="850" width="560" height="170" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="62" y="898" font-size="26">4. Node3 creates another order</text>
<text x="62" y="950" font-size="23">The client submitted only once.</text>
</g>
<text x="40" y="1155" font-size="24">The proxy retries after a missing reply.</text>
</svg>
