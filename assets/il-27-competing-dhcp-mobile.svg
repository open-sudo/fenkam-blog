<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1040" viewBox="0 0 640 1040" role="img" aria-labelledby="title desc">
<title id="title">IL-29: two DHCP servers on one segment</title><desc id="desc">The new DHCP server ran alongside an existing responder. The captured client checks still used the existing server, and the new server’s lease list was empty.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.kicker{font-size:22px;font-weight:700;letter-spacing:2px;fill:#536170}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:26px;fill:#536170}.node{font-size:32px;font-weight:700}.node-small{font-size:30px;font-weight:700}.body{font-size:26px}.small{font-size:24px;fill:#536170}.blue{fill:#185b8c}.green{fill:#176b50}.red{fill:#a33d32}.center{text-anchor:middle}</style>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#185b8c"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#176b50"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#a33d32"/></marker></defs>
<rect width="640" height="1040" fill="#f7f9fb"/>
<text x="32" y="48" class="kicker">IL-29 · DHCP ASSIGNMENT</text>
<text x="32" y="100" class="title">Two DHCP servers.</text>
<text x="32" y="140" class="sub">Clients still used the first.</text>
<rect x="32" y="174" width="576" height="762" rx="14" fill="#edf2f6" stroke="#c9d2db" stroke-width="2"/>
<text x="56" y="216" class="kicker">SAME NETWORK SEGMENT</text>
<rect x="64" y="249" width="512" height="145" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="88" y="295" class="node-small">Existing DHCP server</text>
<text x="88" y="345" class="body green">Supplies client addresses</text>
<rect x="64" y="471" width="512" height="150" rx="14" fill="#fff3ef" stroke="#dbada5" stroke-width="2"/>
<text x="88" y="518" class="node-small">New dnsmasq server</text>
<text x="88" y="572" class="body red">Running · no leases</text>
<rect x="64" y="769" width="512" height="135" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="88" y="817" class="node">Clients</text>
<text x="88" y="864" class="body">Used the existing responder</text>
<path d="M576 322 H594 V836 H578" fill="none" stroke="#176b50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="64" y="690" class="body green">Addresses came from the</text>
<text x="64" y="727" class="body green">existing DHCP server.</text>
<text x="48" y="985" class="small">A running process did not prove</text><text x="48" y="1017" class="small">the new server served these clients.</text>
</svg>