<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1230" viewBox="0 0 640 1230" role="img" aria-labelledby="title desc">
<title id="title">IL-22: The ping record included an interruption</title>
<desc id="desc">The saved ping sequence missed 245 replies before traffic recovered. The final report nevertheless claimed no packet loss.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1230" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-22  /  EVENT TIMELINE</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The ping record included an</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">interruption</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Observed sequence in the network-failover</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">example.</text>
<path d="M70 268 L70 1028" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="70" cy="310" r="9" fill="#175c88"/>
<g data-node="Route interrupted" data-bounds="108,248,484,142">
<rect x="108" y="248" width="484" height="142" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="350" y="301.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Route interrupted</text>
<text x="350" y="346.68" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Failover test begins</text>
</g>
<circle cx="70" cy="514" r="9" fill="#a3342c"/>
<g data-node="About 245 replies missing" data-bounds="108,452,484,142">
<rect x="108" y="452" width="484" height="142" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="350" y="489.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">About 245 replies missing</text>
<text x="350" y="534.18" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Traffic does not recover</text>
<text x="350" y="567.18" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">automatically</text>
</g>
<circle cx="70" cy="718" r="9" fill="#8d580d"/>
<g data-node="Manual route correction" data-bounds="108,656,484,142">
<rect x="108" y="656" width="484" height="142" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="350" y="709.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Manual route correction</text>
<text x="350" y="754.68" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Roughly two minutes later</text>
</g>
<circle cx="70" cy="922" r="9" fill="#176b50"/>
<g data-node="Traffic returns" data-bounds="108,860,484,142">
<rect x="108" y="860" width="484" height="142" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="350" y="913.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Traffic returns</text>
<text x="350" y="958.68" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Report says: no packet loss</text>
</g>
<text x="40" y="1128.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The final no-loss report omitted 245</text><text x="40" y="1160.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">missing replies and manual repair.</text></svg>