<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1640" viewBox="0 0 640 1640" role="img" aria-labelledby="title desc">
<title id="title">IL-42: The generated HTTPS service used existing libraries</title>
<desc id="desc">Component diagram of the custom HTTPS approach. HTTP and TLS came from existing Python libraries; the operator inherited the service and certificate-loading code.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1640" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-42  /  COMPONENT DIAGRAM</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The generated HTTPS service</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">used existing libraries</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">RHEL 9: Python HTTP/TLS code listened on port</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">8443.</text>
<g data-node="HTTPS client" data-bounds="48,248,544,100">
<rect x="48" y="248" width="544" height="100" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="281.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">HTTPS client</text>
<text x="320" y="328.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Connect to port 8443</text>
</g>
<rect x="32" y="473" width="576" height="450" rx="14" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="52" y="508" font-size="23" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">Generated Python service</text>
<g data-node="TLS library" data-bounds="64,558,512,120">
<rect x="64" y="558" width="512" height="120" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="601.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">TLS library</text>
<text x="320" y="648.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Load certificate for connection</text>
</g>
<g data-node="HTTP handler" data-bounds="64,758,512,120">
<rect x="64" y="758" width="512" height="120" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="801.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">HTTP handler</text>
<text x="320" y="848.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Serve the request</text>
</g>
<path d="M320 349 L320 557" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M320 679 L320 757" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<g data-node="Active certificate file" data-bounds="48,1048,544,130">
<path d="M48 1065 C48 1043,592 1043,592 1065 V1161 C592 1183,48 1183,48 1161 Z M48 1065 C48 1087,592 1087,592 1065" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="1112.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Active certificate file</text>
<text x="320" y="1159.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Renewed certificate + key</text>
</g>
<g data-node="Renewal job" data-bounds="48,1308,544,100">
<rect x="48" y="1308" width="544" height="100" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="1341.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Renewal job</text>
<text x="320" y="1388.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Replace certificate before expiry</text>
</g>
<path d="M320 1307 L320 1180" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M592 1113 L615 1113 L615 618 L578 618" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="40" y="1538" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">100 rotation-time requests completed without</text>
<text x="40" y="1570" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">failure; reboot recovery was also demonstrated.</text>
</svg>
