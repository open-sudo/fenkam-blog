<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-18: SSH access failed during the memory test</title><desc id="desc">RHEL test sequence: API responding, swap disabled and memory load started, Bash unable to fork, then SSH connections failing.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}</style>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="50" font-size="18">IL-18 / RHEL 7.9 / RECORDED SEQUENCE</text>
<text x="40" y="100" font-size="28">SSH failed during the memory test</text>
<g data-bounds="40,150,560,180"><rect x="40" y="150" width="560" height="180" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="64" y="194" font-size="26">1. API responding</text>
<text x="64" y="240" font-size="23">Service active; requests answered.</text>
<text x="64" y="276" font-size="23">OOMScoreAdjust=-1000 confirmed.</text>
</g>
<g data-bounds="40,375,560,180"><rect x="40" y="375" width="560" height="180" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="64" y="419" font-size="26">2. Agent starts memory load</text>
<text x="64" y="465" font-size="23">Swap disabled; Python hog running.</text>
<text x="64" y="501" font-size="23">Hog then logs 1000 MiB allocated.</text>
</g>
<g data-bounds="40,600,560,180"><rect x="40" y="600" width="560" height="180" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="64" y="644" font-size="26">3. Shell command fails</text>
<text x="64" y="690" font-size="23">bash: fork:</text>
<text x="64" y="726" font-size="23">Cannot allocate memory</text>
</g>
<g data-bounds="40,825,560,180"><rect x="40" y="825" width="560" height="180" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="64" y="869" font-size="26">4. SSH connections fail</text>
<text x="64" y="915" font-size="23">Repeated commands cannot run.</text>
<text x="64" y="951" font-size="23">No restored access before run ends.</text>
</g>
<text x="40" y="1120" font-size="23">Checks and cleanup stopped when SSH failed.</text>
</svg>
