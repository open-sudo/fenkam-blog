<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-26: A simulated outage became final configuration</title>
<desc id="desc">The agent disabled normal CentOS repositories for the local-installation test and left their definition files outside the active directory afterward.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-26  /  STATE MACHINE</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">A simulated outage became final configuration</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">CentOS local-repository demonstration.</text>
<g data-node="Normal repositories" data-bounds="64,301,320,178">
<rect x="64" y="301" width="320" height="178" rx="26" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="224" y="374.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Normal repositories</text>
<text x="224" y="419.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Active configuration</text>
</g>
<path d="M384 390 L439 390" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<rect x="277" y="517" width="270" height="35.28" rx="4" fill="#f7fafc"/>
<text x="412" y="543" font-size="22" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Create test outage</text>
<g data-node="Remote files moved" data-bounds="440,301,320,178">
<rect x="440" y="301" width="320" height="178" rx="26" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="600" y="359.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Remote files moved</text>
<text x="600" y="404.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Local installation</text>
<text x="600" y="434.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">succeeds</text>
</g>
<path d="M760 390 L815 390" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="653" y="517" width="270" height="35.28" rx="4" fill="#f7fafc"/>
<text x="788" y="543" font-size="22" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Finish demonstration</text>
<g data-node="Handover state" data-bounds="816,301,320,178">
<rect x="816" y="301" width="320" height="178" rx="26" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="976" y="359.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Handover state</text>
<text x="976" y="404.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Normal files not</text>
<text x="976" y="434.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">restored</text>
</g>
<circle cx="48" cy="390" r="7" fill="#17212b"/>
<path d="M55 390 L64 390" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<text x="64" y="737.0" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">The final configuration still excluded the normal CentOS repositories.</text></svg>