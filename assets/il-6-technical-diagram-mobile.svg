<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1042" viewBox="0 0 640 1042" role="img" aria-labelledby="title desc">
<title id="title">IL-6: The transfer ended; SSH trust remained</title>
<desc id="desc">The agent copied the reporting credential successfully and deleted the temporary files. Its later commands did not remove the SSH key or authorization entries.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
