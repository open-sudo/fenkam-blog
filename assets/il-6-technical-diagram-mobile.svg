rUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1042" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-6  /  SEQUENCE DIAGRAM</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The transfer ended; SSH trust</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">remained</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Ubuntu 16.04 database import: setup access</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">outlived the file-copy job.</text>
<rect x="48" y="248" width="544" height="130" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="70" y="279" font-size="24" fill="#546574" style="fill:#546574" text-anchor="start">Sending server → Receiving server</text>
<text x="70" y="326" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Establish SSH key authorization</text>
<text x="570" y="279" font-size="20" fill="#546574" style="fill:#546574" text-anchor="end">1</text>
<path d="M320 379 L320 405" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/>
<rect x="48" y="406" width="544" height="130" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="70" y="437" font-size="24" fill="#546574" style="fill:#546574" text-anchor="start">Sending server → Receiving server</text>
<text x="70" y="484" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Copy database credential file</text>
<text x="570" y="437" font-size="20" fill="#546574" style="fill:#546574" text-anchor="end">2</text>
<path d="M320 537 L320 563" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/>
<rect x="48" y="564" width="544" height="130" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="70" y="595" font-size="24" fill="#546574" style="fill:#546574" text-anchor="start">Sending server · local step</text>
<text x="70" y="642" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Complete the import</text>
<text x="570" y="595" font-size="20" fill="#546574" style="fill:#546574" text-anchor="end">3</text>
<path d="M320 695 L320 721" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/>
<rect x="48" y="722" width="544" height="130" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="70" y="753" font-size="24" fill="#546574" style="fill:#546574" text-anchor="start">Retained state</text>
<text x="70" y="800" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">After transfer: key and authorization</text>
<text x="70" y="834" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">remain</text>
<text x="570" y="753" font-size="20" fill="#546574" style="fill:#546574" text-anchor="end">4</text>
<text x="40" y="940.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The transfer succeeded. The later commands</text><text x="40" y="972.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">did not remove the SSH setup.</text></svg>