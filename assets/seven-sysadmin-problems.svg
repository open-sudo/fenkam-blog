<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#f7fafc"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="18" fill="#546574">LLM AS SYSADMIN / RECORDED CASES</text><text x="36" y="95" font-family="Arial,sans-serif" font-size="38" font-weight="bold" fill="#17212b">Seven operational problems</text><rect x="36" y="145" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="181" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">1. Core system changes</text><text x="58" y="218" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">Swap setup selected an older kernel.</text><rect x="612" y="145" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="634" y="181" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">2. Skipped security checks</text><text x="634" y="218" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A package retry disabled signature checks.</text><rect x="36" y="299" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="335" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">3. Lost existing configuration</text><text x="58" y="372" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A cron test removed root&#8217;s schedule.</text><rect x="612" y="299" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="634" y="335" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">4. Retained setup access</text><text x="634" y="372" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A transfer left root SSH authorization.</text><rect x="36" y="453" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="489" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">5. Untested automation</text><text x="58" y="526" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A prepared host skipped initialization.</text><rect x="612" y="453" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="634" y="489" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">6. Restart failures</text><text x="634" y="526" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A working bridge disappeared on reboot.</text><rect x="36" y="607" width="552" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="643" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">7. Inaccurate reports</text><text x="58" y="680" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A no-loss claim omitted missing replies.</text></svg>