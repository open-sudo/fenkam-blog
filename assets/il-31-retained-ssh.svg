<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-31: root SSH trust left after a transfer</title><desc id="desc">A PostgreSQL primary retained a private SSH key. Both standbys retained the matching root authorization after a file transfer. A later root compromise of the primary could permit root logins to reachable standbys that still accept the key.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.kicker{font-size:22px;font-weight:700;letter-spacing:2px;fill:#536170}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:26px;fill:#536170}.node{font-size:32px;font-weight:700}.node-small{font-size:30px;font-weight:700}.body{font-size:26px}.small{font-size:24px;fill:#536170}.blue{fill:#185b8c}.green{fill:#176b50}.red{fill:#a33d32}.center{text-anchor:middle}</style>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#185b8c"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#176b50"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#a33d32"/></marker></defs>
<rect width="1200" height="800" fill="#f7f9fb"/>
<text x="64" y="54" class="kicker">IL-31 · RETAINED ACCESS</text>
<text x="64" y="112" class="title">One transfer left two root login routes</text>
<text x="64" y="158" class="sub">The password files were deleted. The SSH key and authorizations remained.</text>
<rect x="64" y="305" width="340" height="210" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="88" y="353" class="node-small">PostgreSQL primary</text>
<text x="88" y="400" class="body">Private SSH key kept</text>
<rect x="88" y="438" width="292" height="48" rx="14" fill="#fff3ef" stroke="#dbada5" stroke-width="2"/>
<text x="108" y="471" class="body">id_ed25519</text>
<rect x="800" y="220" width="336" height="170" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="824" y="268" class="node">Standby 1</text>
<text x="824" y="314" class="body">Accepts key for root</text>
<text x="824" y="356" class="small">authorized_keys kept</text>
<rect x="800" y="500" width="336" height="170" rx="14" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
<text x="824" y="548" class="node">Standby 2</text>
<text x="824" y="594" class="body">Accepts key for root</text>
<text x="824" y="636" class="small">authorized_keys kept</text>
<path d="M404 410 H620 V305 H798" fill="none" stroke="#185b8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M620 410 V585 H798" fill="none" stroke="#185b8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="620" y="217" class="body blue center">Root SSH</text>
<text x="620" y="692" class="small center">Access used for setup; not needed for ongoing replication.</text>
<rect x="64" y="720" width="1072" height="54" rx="14" fill="#fff3ef" stroke="#dbada5" stroke-width="2"/>
<text x="84" y="756" class="body red">A later primary compromise could expose both reachable standbys.</text>
</svg>
