<rect x="415" y="216" width="350" height="35.28" rx="4" fill="#f7fafc"/>
<text x="590" y="242" font-size="22" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Required replication</text>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">Dashed links show required replication, not observed traffic. This was an unfinished new setup.</text>
