<text x="968" y="559.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Standby 2</text>
<text x="968" y="604.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Service stopped</text>
