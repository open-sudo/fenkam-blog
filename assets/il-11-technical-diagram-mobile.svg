<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-11: Two independent software trust checks</title>
<desc id="desc">The version-lock installation skipped package signatures. A separate Docker download skipped verification of the HTTPS server certificate.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-11  /  TRUST MODEL</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Two independent software trust</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">checks</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Separate tasks skipped package signatures</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">and HTTPS server certificate checks.</text>
<g data-node="Download server" data-bounds="48,248,544,80">
<rect x="48" y="248" width="544" height="80" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="295.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Download server</text>
</g>
<path d="M320 328 L320 357" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="TLS identity check" data-bounds="113,358,414,126">
<path d="M320.0 358 L527 421.0 L320.0 484 L113 421.0 Z" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="428.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">TLS identity check</text>
</g>
<text x="320" y="538" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle">Does this server match its certificate?</text>
<g data-node="Package artifact" data-bounds="48,608,544,80">
<rect x="48" y="608" width="544" height="80" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="655.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Package artifact</text>
</g>
<path d="M320 688 L320 717" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Signature check" data-bounds="113,718,414,126">
<path d="M320.0 718 L527 781.0 L320.0 844 L113 781.0 Z" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="788.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Signature check</text>
</g>
<text x="320" y="898" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle">Was this package signed by a trusted</text>
<text x="320" y="932" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle">key?</text>
<text x="40" y="1058.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Both installations worked after the agent</text><text x="40" y="1090.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">skipped an authenticity check.</text></svg>