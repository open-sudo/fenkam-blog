<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-42: The generated HTTPS service used existing libraries</title>
<desc id="desc">Component diagram of the custom HTTPS approach. HTTP and TLS came from existing Python libraries; the operator inherited the service and certificate-loading code.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-42  /  COMPONENT DIAGRAM</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The generated HTTPS service used existing libraries</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">RHEL 9: Python HTTP/TLS code listened on port 8443.</text>
<g data-node="HTTPS client" data-bounds="64,360,230,140">
<rect x="64" y="360" width="230" height="140" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="179" y="414.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">HTTPS client</text>
<text x="179" y="457.745" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Port 8443</text>
</g>
<rect x="350" y="210" width="500" height="455" rx="14" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="370" y="245" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">Generated Python service</text>
<g data-node="TLS library" data-bounds="380,300,440,120">
<rect x="380" y="300" width="440" height="120" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="600" y="344.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">TLS library</text>
<text x="600" y="389.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Load certificate per connection</text>
</g>
<g data-node="HTTP handler" data-bounds="380,500,440,120">
<rect x="380" y="500" width="440" height="120" rx="10" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="600" y="544.42" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">HTTP handler</text>
<text x="600" y="589.18" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Serve response</text>
</g>
<path d="M295 430 L325 430 L325 360 L379 360" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M600 421 L600 499" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<g data-node="Active certificate" data-bounds="920,300,220,180">
<path d="M920 317 C920 295,1140 295,1140 317 V463 C1140 485,920 485,920 463 Z M920 317 C920 339,1140 339,1140 317" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="1030" y="375" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Active</text>
<text x="1030" y="404.25" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">certificate</text>
<text x="1030" y="445.5" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Cert + key</text>
</g>
<g data-node="Renewal job" data-bounds="920,530,220,130">
<rect x="920" y="530" width="220" height="130" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="1030" y="563.625" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Renewal job</text>
<text x="1030" y="604.875" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Replace</text>
<text x="1030" y="634.875" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">certificate</text>
</g>
<path d="M1030 529 L1030 481" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M919 370 L821 370" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">100 rotation-time requests completed without failure; reboot recovery was also demonstrated.</text>
</svg>
