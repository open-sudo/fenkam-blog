<rect x="64.0" y="552" width="522.0" height="100" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="325" y="609.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Serve both supplied sites</text>
</g>
<text x="875" y="234" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">4 Linux releases</text>
<g data-node="Write a Python HTTP server" data-bounds="614.0,298,522.0,100">
<rect x="614.0" y="298" width="522.0" height="100" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="875" y="355.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Write a Python HTTP server</text>
</g>
<path d="M875 398 L875 424" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
