<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-1: One request, two deployment choices</title>
<desc id="desc">Deployment comparison for the two-website task. Functional success did not establish that custom server code was necessary.</desc>
