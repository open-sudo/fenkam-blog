<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-1  /  DEPLOYMENT COMPARISON</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">One request, two deployment choices</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The same hostname-routing task produced different software to maintain.</text>
<text x="325" y="234" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">6 Linux releases</text>
<g data-node="Apache or nginx" data-bounds="64.0,298,522.0,100">
<rect x="64.0" y="298" width="522.0" height="100" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="325" y="355.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Apache or nginx</text>
</g>
<path d="M325 398 L325 424" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
