rUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-15  /  FILESYSTEM TREE</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Test files stayed among the backups</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Retention testing created archives that looked like operational backups.</text>
<g data-node="Backup directory at handover" data-bounds="64,360,350,150">
<path d="M64 373 H193.5 L214.5 390 H414 V510 H64 Z" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="239" y="442.04" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Backup directory at</text>
<text x="239" y="474.8" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">handover</text>
</g>
<g data-node="Genuine archive" data-bounds="650,210,486,125">
<path d="M650 227 C650 205,1136 205,1136 227 V318 C1136 340,650 340,650 318 Z M650 227 C650 249,1136 249,1136 227" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="893" y="272.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Genuine archive</text>
<text x="893" y="317.68" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Real recovery data</text>
</g>
<path d="M414 435 L540 435 L540 272 L649 272" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<g data-node="Backdated test copy" data-bounds="650,365,486,125">
<path d="M650 382 C650 360,1136 360,1136 382 V473 C1136 495,650 495,650 473 Z M650 382 C650 404,1136 404,1136 382" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="893" y="427.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Backdated test copy</text>
<text x="893" y="472.68" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Copied from a later archive</text>
</g>
<path d="M414 435 L540 435 L540 427 L649 427" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<g data-node="More backdated copies" data-bounds="650,520,486,125">
<path d="M650 537 C650 515,1136 515,1136 537 V628 C1136 650,650 650,650 628 Z M650 537 C650 559,1136 559,1136 537" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="893" y="582.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">More backdated copies</text>
<text x="893" y="627.68" font-size="24" fill="#546574" style="fill:#546574" text-anchor="middle">Still present after the test</text>
</g>
<path d="M414 435 L540 435 L540 582 L649 582" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="64" y="737.0" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">Every backdated test copy contained the same September 3 data.</text></svg>