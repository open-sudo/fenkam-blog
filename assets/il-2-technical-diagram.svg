<text x="325" y="609.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Boot kernel 4.4.0-142</text>
</g>
<text x="875" y="234" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Separate matching-module run</text>
