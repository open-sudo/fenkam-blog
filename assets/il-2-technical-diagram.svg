<rect x="614.0" y="552" width="522.0" height="100" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="875" y="609.155" font-size="27" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Keep kernel 4.4.0-210</text>
</g>
<text x="64" y="737" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">Each module must match its kernel. The second run showed the downgrade was avoidable.</text>
