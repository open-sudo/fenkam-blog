<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-2  /  DEPENDENCY GRAPH</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The module followed the kernel version</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Ubuntu 16.04: zram needed modules matching the kernel that actually booted.</text>
<text x="325" y="234" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Downgrade run</text>
