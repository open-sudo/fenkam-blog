<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1230" viewBox="0 0 640 1230" role="img" aria-labelledby="title desc">
<title id="title">IL-13: A failed input step reached live accounts</title>
<desc id="desc">OpenSSL failed to generate passwords, but the shell continued into SQL statements with empty values. PostgreSQL cleared the role passwords before the agent repaired them.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1230" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-13  /  FLOWCHART</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">A failed input step reached live</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">accounts</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Database role setup continued after password</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">generation failed.</text>
<g data-node="Generate password with OpenSSL" data-bounds="64,248,512,128">
<rect x="64" y="248" width="512" height="128" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="319.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Generate password with OpenSSL</text>
</g>
<path d="M320 377 L320 461" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<rect x="348.5" y="385" width="235" height="36.52" rx="4" fill="#f7fafc"/>
<text x="466" y="412" font-size="23" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Failure</text>
<g data-node="OpenSSL missing: generation fails" data-bounds="64,462,512,128">
<rect x="64" y="462" width="512" height="128" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="533.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">OpenSSL missing: generation fails</text>
</g>
<path d="M320 591 L320 675" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<rect x="348.5" y="599" width="235" height="36.52" rx="4" fill="#f7fafc"/>
<text x="466" y="626" font-size="23" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">No validation stop</text>
<g data-node="Account update still executes" data-bounds="64,676,512,128">
<rect x="64" y="676" width="512" height="128" rx="10" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="747.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Account update still executes</text>
</g>
<path d="M320 805 L320 889" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="348.5" y="813" width="235" height="36.52" rx="4" fill="#f7fafc"/>
<text x="466" y="840" font-size="23" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Repair afterward</text>
<g data-node="Passwords cleared, then corrected" data-bounds="64,890,512,128">
<rect x="64" y="890" width="512" height="128" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="961.685" font-size="29" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Passwords cleared, then corrected</text>
</g>
<text x="40" y="1128.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Empty password values reached SQL. The</text><text x="40" y="1160.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">agent repaired the accounts afterward.</text></svg>