<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">IL-30: Maildir use can invalidate a filename guard</title>
<desc id="desc">If reading a message changes its Maildir filename, Ansible could find its original destination absent and import the same message again.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="1200" height="800" fill="#f7fafc"/>
<text x="64" y="50" font-size="19" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-30  /  SEQUENCE DIAGRAM</text>
<text x="64" y="104" font-size="40" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Maildir use can invalidate a filename guard</text>
<text x="64" y="141" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Illustrative rerun after a normal message-state change.</text>
<g data-node="Ansible" data-bounds="25.0,210,250,72">
<rect x="25.0" y="210" width="250" height="72" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="150" y="252.625" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Ansible</text>
</g>
<path d="M150 283 L150 675" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/>
<g data-node="Maildir" data-bounds="475.0,210,250,72">
<rect x="475.0" y="210" width="250" height="72" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="600" y="252.625" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Maildir</text>
</g>
<path d="M600 283 L600 675" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/>
<g data-node="Mail client" data-bounds="925.0,210,250,72">
<rect x="925.0" y="210" width="250" height="72" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="1050" y="252.625" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Mail client</text>
</g>
<path d="M1050 283 L1050 675" fill="none" stroke="#546574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/>
<path d="M150 340 L600 340" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="157" y="300" width="436" height="35" rx="4" fill="#f7fafc"/>
<text x="375" y="327" font-size="23" fill="#175c88" style="fill:#175c88" text-anchor="middle" class="edge">Import two.eml:2, with force:false</text>
<path d="M1050 417 L600 417" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="607" y="377" width="436" height="35" rx="4" fill="#f7fafc"/>
<text x="825" y="404" font-size="23" fill="#175c88" style="fill:#175c88" text-anchor="middle" class="edge">Read message: flags can rename file</text>
<path d="M150 494 L600 494" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="157" y="454" width="436" height="35" rx="4" fill="#f7fafc"/>
<text x="375" y="481" font-size="23" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">Rerun checks the original pathname</text>
<path d="M600 571 L150 571" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="157" y="531" width="436" height="35" rx="4" fill="#f7fafc"/>
<text x="375" y="558" font-size="23" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">Original name is now absent</text>
<path d="M150 648 L600 648" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#amber)"/>
<rect x="157" y="608" width="436" height="35" rx="4" fill="#f7fafc"/>
<text x="375" y="635" font-size="23" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">Could import the same message again</text>
<text x="64" y="737.0" font-size="22" fill="#546574" style="fill:#546574" text-anchor="start">A read-state change could make the playbook import the message again.</text></svg>