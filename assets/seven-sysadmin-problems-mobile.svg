<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1200" width="640" height="1200"><rect width="640" height="1200" fill="#f7fafc"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="18" fill="#546574">LLM AS SYSADMIN / RECORDED CASES</text><text x="36" y="95" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#17212b">Seven operational problems</text><rect x="36" y="140" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="176" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">1. Core system changes</text><text x="58" y="213" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">Swap setup selected an older kernel.</text><rect x="36" y="282" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="318" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">2. Skipped security checks</text><text x="58" y="355" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A package retry disabled signature</text><text x="58" y="383" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">checks.</text><rect x="36" y="424" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="460" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">3. Lost existing configuration</text><text x="58" y="497" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A cron test removed root&#8217;s schedule.</text><rect x="36" y="566" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="602" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">4. Retained setup access</text><text x="58" y="639" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A transfer left root SSH authorization.</text><rect x="36" y="708" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="744" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">5. Untested automation</text><text x="58" y="781" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A prepared host skipped initialization.</text><rect x="36" y="850" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="886" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">6. Restart failures</text><text x="58" y="923" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A working bridge disappeared on reboot.</text><rect x="36" y="992" width="568" height="124" rx="12" fill="#edf5fc" stroke="#a8bdcd"/><text x="58" y="1028" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17212b">7. Inaccurate reports</text><text x="58" y="1065" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">A no-loss claim omitted missing</text><text x="58" y="1093" font-family="Arial,sans-serif" font-size="23" fill="#374b5c">replies.</text></svg>