<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-10: The last confirmed state was unreachable</title>
<desc id="desc">Snapshot recovery worked before the restart request. Later remote probes timed out, and access did not return before the run ended.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-10  /  STATE MACHINE</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The last confirmed state was</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">unreachable</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Storage changes were followed by a reboot test.</text>
<g data-node="Reachable host" data-bounds="48,232,544,140">
<rect x="48" y="232" width="544" height="140" rx="26" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="285.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Reachable host</text>
<text x="320" y="332.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Storage setup changed</text>
</g>
<path d="M320 372 L320 456" fill="none" stroke="#8d580d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="344" y="379" width="240" height="39" rx="4" fill="#f7fafc"/>
<text x="464" y="408" font-size="25" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Reboot</text>
<g data-node="Restart requested" data-bounds="48,457,544,140">
<rect x="48" y="457" width="544" height="140" rx="26" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="510.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Restart requested</text>
<text x="320" y="557.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Restart requested</text>
</g>
<path d="M320 597 L320 681" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<rect x="344" y="604" width="240" height="39" rx="4" fill="#f7fafc"/>
<text x="464" y="633" font-size="25" fill="#546574" style="fill:#546574" text-anchor="middle" class="edge">Remote probes fail</text>
<g data-node="No remote access" data-bounds="48,682,544,140">
<rect x="48" y="682" width="544" height="140" rx="26" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="735.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">No remote access</text>
<text x="320" y="782.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Test ends without recovery</text>
</g>
<circle cx="320" cy="210" r="7" fill="#17212b"/>
<path d="M320 217 L320 232" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<text x="40" y="1058.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Remote access did not return before the</text><text x="40" y="1090.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">run ended.</text></svg>