<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-16: Verification access exceeded the check</title>
<desc id="desc">Access-control comparison. The recorded global database grant exceeded the verification operation and remained after testing.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-16  /  ACCESS-CONTROL MATRIX</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Verification access exceeded the</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">check</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">A database test account was left with ALL</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">PRIVILEGES on *.*.</text>
<text x="48" y="268" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Required check</text>
<g data-node="Task need: Needed" data-bounds="48,290,544,65">
<rect x="48" y="290" width="544" height="65" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="329.125" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Task need: Needed</text>
</g>
<g data-node="Delivered account: Allowed" data-bounds="48,363,544,65">
<rect x="48" y="363" width="544" height="65" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="402.125" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Delivered account: Allowed</text>
</g>
<text x="48" y="492" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Other database writes</text>
<g data-node="Task need: Not justified" data-bounds="48,514,544,65">
<rect x="48" y="514" width="544" height="65" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="553.125" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Task need: Not justified</text>
</g>
<g data-node="Delivered account: Also allowed" data-bounds="48,587,544,65">
<rect x="48" y="587" width="544" height="65" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="626.125" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Delivered account: Also allowed</text>
</g>
<text x="48" y="716" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">After verification</text>
<g data-node="Task need: No ongoing need stated" data-bounds="48,738,544,65">
<rect x="48" y="738" width="544" height="65" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="777.125" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Task need: No ongoing need stated</text>
</g>
<g data-node="Delivered account: Account retained" data-bounds="48,811,544,65">
<rect x="48" y="811" width="544" height="65" rx="10" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="850.125" font-size="25" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Delivered account: Account retained</text>
</g>
<text x="40" y="1058" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">The successful check demonstrated access, not a</text>
<text x="40" y="1090" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">reason to retain every permission.</text>
</svg>
