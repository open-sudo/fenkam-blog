<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">One test table, privileges over every database</title><desc id="desc">The recorded tests used galeratest.t1. The galtest account received ALL PRIVILEGES ON *.*, covering every database, and the agent finished without removing it.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}</style>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="50" font-size="18">IL-16 / THE TEST AND THE ACCOUNT</text>
<text x="40" y="100" font-size="30">One test table, privileges</text>
<text x="40" y="140" font-size="30">over every database</text>
<g data-bounds="40,190,560,235"><rect x="40" y="190" width="560" height="235" rx="12" fill="#edf5fc" stroke="#879aa9"/>
<text x="62" y="235" font-size="26">The recorded checks</text>
<text x="62" y="285" font-size="23">Local mysql commands on each member</text>
<text x="62" y="321" font-size="23">Read and write galeratest.t1</text>
<text x="62" y="357" font-size="23">Commands did not select galtest</text>
</g>
<g data-bounds="40,475,560,235"><rect x="40" y="475" width="560" height="235" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="62" y="520" font-size="26">The account the agent created</text>
<text x="62" y="570" font-size="23">galtest with ALL PRIVILEGES ON *.*</text>
<text x="62" y="606" font-size="23">Read, change, and delete data</text>
<text x="62" y="642" font-size="23">across all databases</text>
</g>
<g data-bounds="40,760,560,235"><rect x="40" y="760" width="560" height="235" rx="12" fill="#fff1ee" stroke="#879aa9"/>
<text x="62" y="805" font-size="26">At the end of the run</text>
<text x="62" y="855" font-size="23">Cluster checks passed.</text>
<text x="62" y="891" font-size="23">The agent did not remove the account</text>
<text x="62" y="927" font-size="23">or reduce its permissions.</text>
</g>
</svg>
