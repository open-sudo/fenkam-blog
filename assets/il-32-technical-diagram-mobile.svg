<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-32: The request handler inherited root authority</title>
<desc id="desc">The upload handler ran as root. Code executed through a hypothetical defect in that handler would inherit its authority over the host.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-32  /  TRUST BOUNDARY</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">The request handler inherited</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">root authority</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Ubuntu 16.04 upload receiver: User=root and</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Group=root.</text>
<rect x="32" y="248" width="576" height="730" rx="14" fill="#eef3f7" stroke="#a7b8c7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="52" y="283" font-size="23" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">Host · root authority</text>
<g data-node="Upload request handler" data-bounds="64,348,512,140">
<ellipse cx="320.0" cy="418.0" rx="256.0" ry="70.0" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="401.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Upload request handler</text>
<text x="320" y="448.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">User=root · Group=root</text>
</g>
<g data-node="Upload directory" data-bounds="64,588,512,130">
<path d="M64 601 H253.44 L284.15999999999997 618 H576 V718 H64 Z" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="652.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Upload directory</text>
<text x="320" y="699.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Required write access</text>
</g>
<g data-node="Other system files" data-bounds="64,808,512,120">
<path d="M64 821 H253.44 L284.15999999999997 838 H576 V928 H64 Z" fill="#fff1ee" stroke="#a3342c" stroke-width="2"/>
<text x="320" y="867.45" font-size="30" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Other system files</text>
<text x="320" y="914.55" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Authority extends beyond uploads</text>
</g>
<path d="M320 489 L320 587" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M577 418 L597 418 L597 868 L578 868" fill="none" stroke="#a3342c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#red)"/>
<text x="40" y="1058.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">A hypothetical handler compromise would</text><text x="40" y="1090.0" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">inherit its root privileges.</text></svg>