<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">IL-34: Source cleanup did not verify installed code</title>
<desc id="desc">Software-supply data flow. Removing the temporary gpgcheck=0 source definition did not retroactively authenticate the packages already installed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .label{font-weight:700} .small{fill:#546574}</style>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#175c88"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#175c88"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#176b50"/></marker><marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#176b50"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#a3342c"/></marker><marker id="red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#a3342c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#8d580d"/></marker><marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#8d580d"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#17212b"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#17212b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#546574"/></marker><marker id="muted-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#546574"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#b8c7d3"/></marker><marker id="line-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10Z" fill="#b8c7d3"/></marker></defs>
<rect width="640" height="1160" fill="#f7fafc"/>
<text x="40" y="47" font-size="18" fill="#546574" style="fill:#546574" text-anchor="start" font-weight="700">IL-34  /  DATA-FLOW DIAGRAM</text>
<text x="40" y="98" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">Source cleanup did not verify</text>
<text x="40" y="141" font-size="36" fill="#17212b" style="fill:#17212b" text-anchor="start" font-weight="700">installed code</text>
<text x="40" y="178" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">RHEL 7.9 internal DNS used a temporary CentOS</text>
<text x="40" y="210" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">Vault repository.</text>
<g data-node="Temporary source definition" data-bounds="48,248,544,160">
<path d="M48 265 C48 243,592 243,592 265 V391 C592 413,48 413,48 391 Z M48 265 C48 287,592 287,592 265" fill="#fff7e8" stroke="#8d580d" stroke-width="2"/>
<text x="320" y="326.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Temporary source definition</text>
<text x="320" y="371.68" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">CentOS Vault · gpgcheck=0</text>
</g>
<g data-node="Yum installation" data-bounds="48,518,544,140">
<rect x="48" y="518" width="544" height="140" rx="10" fill="#edf5fc" stroke="#175c88" stroke-width="2"/>
<text x="320" y="570.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Yum installation</text>
<text x="320" y="615.68" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">dnsmasq + verification tools</text>
</g>
<path d="M320 409 L320 517" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<g data-node="Installed packages" data-bounds="48,778,544,140">
<path d="M48 795 C48 773,592 773,592 795 V901 C592 923,48 923,48 901 Z M48 795 C48 817,592 817,592 795" fill="#edf8f2" stroke="#176b50" stroke-width="2"/>
<text x="320" y="846.92" font-size="28" fill="#17212b" style="fill:#17212b" text-anchor="middle" font-weight="700">Installed packages</text>
<text x="320" y="891.68" font-size="26" fill="#546574" style="fill:#546574" text-anchor="middle">Remain after source removal</text>
</g>
<path d="M320 659 L320 777" fill="none" stroke="#175c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="40" y="989" width="560" height="39" rx="4" fill="#f7fafc"/>
<text x="320" y="1018" font-size="25" fill="#8d580d" style="fill:#8d580d" text-anchor="middle" class="edge">Definition removed; binaries remain</text>
<text x="40" y="1058" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">dnsmasq worked after reboot. Neither an</text>
<text x="40" y="1090" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">intercepted download nor a malicious package was</text>
<text x="40" y="1122" font-size="25" fill="#546574" style="fill:#546574" text-anchor="start">observed.</text>
</svg>
